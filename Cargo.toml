[workspace]
members = ["harness", "harness-cli"]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"

[workspace.dependencies]
# rig
rig         = { version = "0.43.0", default-features = false, features = ["reqwest", "agent"] }
rig-core    = { version = "0.43.0", default-features = false, features = ["reqwest"] }
rig-reqwest = { version = "0.43.0" }
rig-http    = { version = "0.43.0" }

# async
tokio       = { version = "1.44.2", features = ["full"] }
tokio-util  = { version = "0.7.19", features = ["rt", "time"] }

# HTTP
reqwest     = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls", "stream"] }

# serialisation
serde       = { version = "1.0.219", features = ["derive"] }
serde_json  = { version = "1.0.140" }

# error handling
anyhow      = { version = "1.0.98" }
thiserror   = { version = "2.0.12" }

# JWT decode (for expiry)
jsonwebtoken = { version = "9.3.1" }

# misc
tracing     = { version = "0.1.41" }
bytes       = { version = "1.10.1" }
http        = { version = "1.3.1" }

# CLI only
clap        = { version = "4.5.39", features = ["derive", "env"] }
dirs        = { version = "5.0.1" }

# tools
hanzo-apply-patch = { version = "0.6.74" }
grep-searcher     = { version = "0.1.17" }
grep-regex        = { version = "0.1.14" }
command-group     = { version = "5.0.1", features = ["with-tokio"] }
globset           = { version = "0.4.18" }
ignore            = { version = "0.4.25" }
similar           = { version = "2.7.0", features = ["text"] }

# test only
tempfile    = { version = "3.20.0" }
